<body>
<div id="stage"><div id="shell"><div id="app"></div><div id="toasts" aria-live="polite"></div></div></div>

<script src="js/config.js"></script>
<script src="js/assets.js"></script>
<script src="js/catalogos.js"></script>
<script src="js/utils.js"></script>
<script src="js/engine.js"></script>
<script>/* revisión visual: nunca instalar ni registrar el service worker (evita ver archivos viejos en caché) */try{if(navigator.serviceWorker){navigator.serviceWorker.register=function(){return Promise.resolve();};if(/^https?:$/.test(location.protocol))navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});}}catch(e){}</script>
<script src="js/pwa.js"></script>
<script src="js/backend.js"></script>
<script src="js/vendor/jspdf.umd.min.js"></script>
<script src="js/vendor/jspdf.plugin.autotable.min.js"></script>
<script src="js/exportar.js"></script>
<script src="js/ui.js"></script>
<script src="js/datos-prueba-visual.js"></script>
<style>
#pv-bar{position:fixed;left:8px;bottom:8px;z-index:99999;width:244px;max-width:calc(100vw - 16px);font:600 12px/1.3 system-ui,Segoe UI,Arial,sans-serif;background:#0b2a45;color:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35);overflow:hidden}
#pv-bar .pv-t{display:block;padding:8px 12px;cursor:pointer}
#pv-bar .pv-t small{font-weight:500;opacity:.8}
#pv-bar .pv-b{display:none;padding:4px 10px 10px;max-height:60vh;overflow:auto}
#pv-bar.abierta .pv-b{display:block}
#pv-bar .pv-b div{margin:8px 0 4px;opacity:.7;font-weight:500}
#pv-bar button{display:block;width:100%;text-align:left;margin:3px 0;padding:8px 10px;border:0;border-radius:8px;background:#14568f;color:#fff;font:inherit;cursor:pointer}
#pv-bar button:hover{background:#1a6cb3}#pv-bar button.act{background:#00ad62}
</style>
<div id="pv-bar" class="abierta"><div class="pv-t" id="pv-t">PRUEBA VISUAL<br><small>Datos de ejemplo · sin Supabase · clic aquí para ocultar o mostrar</small></div><div class="pv-b" id="pv-b"></div></div>
<script>
(function(){
  var b=document.getElementById('pv-b'),bar=document.getElementById('pv-bar'),us=PRUEBA.usuarios();
  var grupos=[['Encargado de proyecto (cambios a revisar)',us.filter(function(u){return u.rol==='ENCARGADO';})],['Otros perfiles (deben verse igual que antes)',us.filter(function(u){return u.rol!=='ENCARGADO';})]];
  grupos.forEach(function(g){var d=document.createElement('div');d.textContent=g[0];b.appendChild(d);g[1].forEach(function(u){var x=document.createElement('button');x.textContent=u.nombre;x.setAttribute('data-uid',u.id);x.onclick=function(){PRUEBA.verComo(u.id);b.querySelectorAll('button').forEach(function(y){y.classList.remove('act');});x.classList.add('act');};b.appendChild(x);});});
  document.getElementById('pv-t').onclick=function(){bar.classList.toggle('abierta');};
  b.querySelector('button').click();
  if(window.innerWidth<700)bar.classList.remove('abierta');
})();
</script>

</body>
</html>
