name: Pruebas
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: node scripts/build-core.mjs && node scripts/gen-sql-permisos.mjs && git diff --exit-code   # core.mjs y permisos al día
      - run: npm test && node tests/estatico.test.mjs
